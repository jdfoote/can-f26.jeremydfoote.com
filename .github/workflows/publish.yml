on:
  push:
    branches: main
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}-1
          restore-keys: r-${{ runner.os }}-

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-1

      - name: Install R packages and TinyTeX
        run: |
          pkgs <- c("tinytex", "rmarkdown", "knitr",
                    "tidygraph", "ggraph", "igraph", "igraphdata",
                    "intergraph", "networkdata", "patchwork",
                    "sna", "tidyverse", "here")
          missing <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
          if (length(missing)) install.packages(missing, repos = "https://cloud.r-project.org")
          if (!tinytex::is_tinytex()) tinytex::install_tinytex()
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
